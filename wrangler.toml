name = "didinska-chatbot"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Create a D1 database in Cloudflare and replace DATABASE_ID below.
[[d1_databases]]
binding = "DB"
database_name = "didinska-chatbot-db"
database_id = "e569a3bf-6b74-45db-b0c2-5c1156d16a78"
migrations_dir = "migrations"

[vars]
DEFAULT_MODEL = "claude-opus-5"
MAX_HISTORY = "20"
MAX_FILE_BYTES = "200000"
